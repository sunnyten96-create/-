name: Build Android APK 0.2.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Restore 0.2.0 source
        shell: bash
        run: |
          cat v020-source.part*.b64 | base64 --decode > v020-source.zip
          unzip -q v020-source.zip
          mv "AI-원고-디렉터-Mobile-0.2.0" mobile-app

      - name: Install current web brand logo
        shell: bash
        run: |
          python -m pip install --quiet pillow
          mkdir -p mobile-app/app/src/main/assets/mobile
          curl -fsSL "https://novelcheck-a1.duckdns.org/brand-logo-8.0.5.png" -o /tmp/brand-logo.png
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          src=Image.open('/tmp/brand-logo.png').convert('RGB')
          white=Image.new('RGB', src.size, 'white')
          diff=ImageChops.difference(src, white)
          bbox=diff.getbbox()
          if not bbox:
              raise SystemExit('official logo image is blank')
          x0,y0,x1,y1=bbox
          pad=max(8, int(max(x1-x0,y1-y0)*0.04))
          x0=max(0,x0-pad); y0=max(0,y0-pad); x1=min(src.width,x1+pad); y1=min(src.height,y1+pad)
          crop=src.crop((x0,y0,x1,y1))
          side=max(crop.size)
          canvas=Image.new('RGB',(side,side),'white')
          canvas.paste(crop,((side-crop.width)//2,(side-crop.height)//2))
          canvas.resize((768,768),Image.Resampling.LANCZOS).save('mobile-app/app/src/main/assets/mobile/brand-logo.png',optimize=True)
          print('logo saved', crop.size)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate mobile JavaScript
        run: node --check mobile-app/app/src/main/assets/mobile/app.js

      - name: Build debug APK
        working-directory: mobile-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp mobile-app/app/build/outputs/apk/debug/app-debug.apk AI-Manuscript-Director-Mobile-v0.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Manuscript-Director-Mobile-v0.2.0-APK
          path: AI-Manuscript-Director-Mobile-v0.2.0.apk
          if-no-files-found: error
          retention-days: 90
