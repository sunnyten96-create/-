name: Build AI Manuscript Director Admin 0.2.0

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ admin-app-v0.2.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Restore Mobile 0.2.0 base
        shell: bash
        run: |
          cat mobile020tiny.part00.b64 mobile020tiny.part01.b64 mobile020tiny.part02.b64 mobile020tiny.part03a.b64 mobile020tiny.part03b.b64 mobile020tiny.part04.b64 mobile020tiny.part05.b64 mobile020tiny.part06.b64 | base64 --decode > mobile020-build.zip
          echo "8785abec837d646a4c4e069900053ec54cceb9b4260bb42e281269cecb6bf721  mobile020-build.zip" | sha256sum -c -
          unzip -q mobile020-build.zip
          mv mobile020_tiny mobile-app

      - name: Restore brand asset required by inherited overlays
        shell: bash
        run: |
          mkdir -p mobile-app/app/src/main/assets/mobile
          mkdir -p mobile-app/app/src/main/res/drawable-nodpi
          base64 --decode brandlogo020.b64 > mobile-app/app/src/main/assets/mobile/brand-logo.png
          cp mobile-app/app/src/main/assets/mobile/brand-logo.png mobile-app/app/src/main/res/drawable-nodpi/brand_logo.png
          echo "702d966318e8b9c35bbb130645f2f51b89b39f611fb9a185d391e317f8d46cdd  mobile-app/app/src/main/assets/mobile/brand-logo.png" | sha256sum -c -

      - name: Apply Mobile 0.2.1 overlay
        shell: bash
        run: |
          cat mobile021overlay.groupA.b64 mobile021overlay.groupB.b64 mobile021overlay.groupC.b64 | base64 --decode > mobile021-overlay.zip
          echo "b204e8f825aaa6aa4a7864f62f4ac148ffa4ee7262eb69626160ff2bedf4f347  mobile021-overlay.zip" | sha256sum -c -
          unzip -o -q mobile021-overlay.zip -d mobile-app

      - name: Apply Mobile 0.2.2 overlay
        shell: bash
        run: |
          cat mobile022overlay.part00.b64 mobile022overlay.part01.b64 mobile022overlay.part02.b64 mobile022overlay.part03.b64 | base64 --decode > mobile022-overlay.zip
          echo "16388b596ee5ecbca8f8b465a6571b4c78e8d103d5178f5dd3a1612c622d0007  mobile022-overlay.zip" | sha256sum -c -
          unzip -o -q mobile022-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.0 overlay
        shell: bash
        run: |
          cat mobile030overlay.part00.b64 mobile030overlay.part01.b64 mobile030overlay.part02.b64 mobile030overlay.part03.b64 | base64 --decode > mobile030-overlay.zip
          echo "1342b7bab7804cc511fc08d39381eb7b2375bc454d25d2111b4b6bc2a8df9231  mobile030-overlay.zip" | sha256sum -c -
          unzip -o -q mobile030-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.1 overlay
        shell: bash
        run: |
          cat mobile031overlay.part00.b64 mobile031overlay.part01.b64 mobile031overlay.part02.b64 mobile031overlay.part03.b64 mobile031overlay.part04.b64 | base64 --decode > mobile031-overlay.zip
          echo "e90d8b1971b76e74a5d0a8468755559040460f70a9978edbccc061212512e041  mobile031-overlay.zip" | sha256sum -c -
          unzip -o -q mobile031-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.2 overlay
        shell: bash
        run: |
          cat mobile032overlay.part00.b64 mobile032overlay.part01.b64 mobile032overlay.part02.b64 mobile032overlay.part03.b64 mobile032overlay.part04.b64 | base64 --decode > mobile032-overlay.zip
          echo "66e55a342341c75ad927f96fee3078b76e93ccceaf5b92b7f8cf539498ac3adb  mobile032-overlay.zip" | sha256sum -c -
          unzip -o -q mobile032-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.3 overlay
        shell: bash
        run: |
          cat mobile033overlay.part00.b64 mobile033overlay.part01.b64 mobile033overlay.part02.b64 mobile033overlay.part03.b64 mobile033overlay.part04.b64 | base64 --decode > mobile033-overlay.zip
          echo "265b6fcb2e5087b1327d677f93095ca4883d1720de1d5d4baaa8c65e70c72560  mobile033-overlay.zip" | sha256sum -c -
          unzip -o -q mobile033-overlay.zip -d mobile-app

      - name: Apply Mobile 0.4.0 baseline
        shell: bash
        run: |
          cat mobile040overlay.part00.b64 mobile040overlay.part01.b64 mobile040overlay.part02.b64 mobile040overlay.part03.b64 mobile040overlay.part04.b64 | base64 --decode > mobile040-overlay.zip
          echo "c98c14db4a08a80e5ff43bcfac5af4f23f3668b170e99347834945f2c4fb4056  mobile040-overlay.zip" | sha256sum -c -
          unzip -o -q mobile040-overlay.zip -d mobile-app

      - name: Convert baseline into Admin 0.1.1
        shell: bash
        run: |
          rm -rf mobile-app/app/src/main/java/kr/novelcheck/mobile
          rm -rf mobile-app/app/src/main/assets/mobile
          cat admin010overlay.part00.b64 admin010overlay.part01.b64 admin010overlay.part02.b64 admin010overlay.part03.b64 admin010overlay.part04.b64 | base64 --decode > admin010-overlay.zip
          echo "8fc3d03190958c5ff8a1fc82667f08a8063b168a45ef1a5900e079567a3f2128  admin010-overlay.zip" | sha256sum -c -
          unzip -o -q admin010-overlay.zip -d mobile-app
          test -f mobile-app/app/src/main/java/kr/novelcheck/admin/MainActivity.java
          test -f mobile-app/app/src/main/assets/admin/app.js
          test ! -d mobile-app/app/src/main/java/kr/novelcheck/mobile

      - name: Apply Admin 0.1.1 name icon score patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('mobile-app')
          p=root/'app/build.gradle'
          t=p.read_text()
          t=t.replace("versionCode 1","versionCode 2").replace("versionName '0.1.0'","versionName '0.1.1'")
          p.write_text(t)

          p=root/'app/src/main/AndroidManifest.xml'
          p.write_text(p.read_text().replace('android:label="AI 원고 디렉터 관리자"','android:label="디렉터 관리자"'))

          p=root/'app/src/main/assets/admin/index.html'
          p.write_text(p.read_text().replace('<title>AI 원고 디렉터 관리자</title>','<title>디렉터 관리자</title>'))

          p=root/'app/src/main/assets/admin/app.js'
          t=p.read_text()
          if 'const score1=' not in t:
              t=t.replace("const fmt=n=>Number(n||0).toLocaleString('ko-KR');",
                          "const fmt=n=>Number(n||0).toLocaleString('ko-KR');\nconst score1=n=>n==null||n===''||!Number.isFinite(Number(n))?'—':Number(n).toFixed(1);")
          t=t.replace('<h1>AI 원고 디렉터 관리자</h1>','<h1>디렉터 관리자</h1>')
          t=t.replace("${r.score==null?'—':esc(r.score)}<small>/100</small>",
                      "${score1(r.score)}<small>/100</small>")
          p.write_text(t)

          p=root/'app/src/main/java/kr/novelcheck/admin/MainActivity.java'
          p.write_text(p.read_text().replace('NovelCheckAdmin/0.1.0','NovelCheckAdmin/0.1.1'))

          p=root/'app/src/main/res/values/colors.xml'
          p.write_text(p.read_text().replace('#6D55D9','#F5B92E').replace('#4834A6','#071730'))
          PY

          cat > mobile-app/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F5B92E"
                  android:pathData="M18,2 H90 C99,2 106,9 106,18 V90 C106,99 99,106 90,106 H18 C9,106 2,99 2,90 V18 C2,9 9,2 18,2 Z" />
              <path android:fillColor="#071730"
                  android:pathData="M20,32 C20,26 25,22 31,22 H47 C59,22 69,31 69,43 V78 C62,72 54,68 45,68 H31 C25,68 20,63 20,57 Z" />
              <path android:fillColor="#071730"
                  android:pathData="M70,43 L92,30 C97,27 101,30 101,35 V77 C101,82 97,85 92,82 L70,69 Z" />
              <path android:fillColor="#F5B92E"
                  android:pathData="M58,36 A12,12 0,1 1,58,60 A12,12 0,1 1,58,36" />
              <path android:fillColor="#071730"
                  android:pathData="M58,40 A8,8 0,1 1,58,56 A8,8 0,1 1,58,40" />
              <path android:fillColor="#123A72"
                  android:pathData="M28,34 H43 C46,34 48,36 48,39 V43 H32 C30,43 28,41 28,39 Z" />
              <path android:fillColor="#123A72"
                  android:pathData="M28,48 H43 C46,48 48,50 48,53 V57 H32 C30,57 28,55 28,53 Z" />
              <path android:fillColor="#071730"
                  android:pathData="M48,8 L51,14 L58,17 L51,20 L48,27 L45,20 L38,17 L45,14 Z" />
          </vector>
          EOF
          cp mobile-app/app/src/main/res/drawable/app_icon.xml mobile-app/app/src/main/res/drawable/ic_launcher.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Admin signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: novelcheck-admin-debug-signing-v1

      - name: Ensure stable Admin signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NovelCheck Admin,O=NovelCheck,C=KR"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256|Valid from"

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Admin 0.1.1
        shell: bash
        run: |
          node --check mobile-app/app/src/main/assets/admin/app.js
          python -c "import xml.etree.ElementTree as ET; ET.parse('mobile-app/app/src/main/AndroidManifest.xml')"
          grep -q "applicationId 'kr.novelcheck.admin'" mobile-app/app/build.gradle
          grep -q "versionCode 2" mobile-app/app/build.gradle
          grep -q "versionName '0.1.1'" mobile-app/app/build.gradle
          grep -q "NovelCheckAdmin/0.1.1" mobile-app/app/src/main/java/kr/novelcheck/admin/MainActivity.java
          grep -q "/platform-api/admin/research" mobile-app/app/src/main/assets/admin/app.js
          grep -q "/platform/report-viewer/index.html" mobile-app/app/src/main/assets/admin/app.js
          grep -q "/platform-api/admin/settings" mobile-app/app/src/main/assets/admin/app.js
          grep -q "state.user.role!=='admin'" mobile-app/app/src/main/assets/admin/app.js
          grep -q 'android:label="디렉터 관리자"' mobile-app/app/src/main/AndroidManifest.xml
          grep -q "const score1=" mobile-app/app/src/main/assets/admin/app.js
          grep -q "toFixed(1)" mobile-app/app/src/main/assets/admin/app.js
          grep -q '#F5B92E' mobile-app/app/src/main/res/drawable/app_icon.xml
          grep -q '#071730' mobile-app/app/src/main/res/drawable/app_icon.xml

      - name: Apply Admin 0.2.0 / Web 9.1.0 patch
        shell: bash
        run: |
          base64 --decode patch_admin020.py.gz.b64 | gzip -dc > patch_admin020.py
          echo "97bba46d47ec56cec3200b219a0ddb1eed7d9860e2cddc3a25e90ada3de29602  patch_admin020.py" | sha256sum -c -
          sed -i "s#root=Path('/mnt/data/app_update_20260929/admin020')#root=Path('mobile-app')#" patch_admin020.py
          python patch_admin020.py

      - name: Validate Admin 0.2.0 / Web 9.1.0 sync
        shell: bash
        run: |
          node --check mobile-app/app/src/main/assets/admin/app.js
          python -c "import xml.etree.ElementTree as ET; ET.parse('mobile-app/app/src/main/AndroidManifest.xml')"
          grep -q "applicationId 'kr.novelcheck.admin'" mobile-app/app/build.gradle
          grep -q "versionName '0.2.0'" mobile-app/app/build.gradle
          grep -q "versionCode 3" mobile-app/app/build.gradle
          grep -q "NovelCheckAdmin/0.2.0" mobile-app/app/src/main/java/kr/novelcheck/admin/MainActivity.java
          grep -q "/platform-api/admin/access?fresh=1" mobile-app/app/src/main/assets/admin/app.js
          grep -q "active-user-list" mobile-app/app/src/main/assets/admin/app.js
          grep -q "serviceChanging" mobile-app/app/src/main/assets/admin/app.js
          grep -q "onJsConfirm" mobile-app/app/src/main/java/kr/novelcheck/admin/MainActivity.java
          grep -q "onJsPrompt" mobile-app/app/src/main/java/kr/novelcheck/admin/MainActivity.java

      - name: Build Admin debug APK
        working-directory: mobile-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK package and signature
        shell: bash
        run: |
          APK=mobile-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='kr.novelcheck.admin'"

      - name: Rename APK
        run: cp mobile-app/app/build/outputs/apk/debug/app-debug.apk AI-Manuscript-Director-Admin-v0.2.0.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Manuscript-Director-Admin-v0.2.0-APK
          path: AI-Manuscript-Director-Admin-v0.2.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish persistent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "admin-v0.2.0" >/dev/null 2>&1; then
            gh release upload "admin-v0.2.0" AI-Manuscript-Director-Admin-v0.2.0.apk --clobber
          else
            gh release create "admin-v0.2.0" AI-Manuscript-Director-Admin-v0.2.0.apk \
              --title "디렉터 관리자 0.2.0" \
              --notes "Web 9.1.0 기준 관리자 앱. 개요에서 현재 활성 작업실 수, 일반 사용자와 관리자/부관리자 활동, 대기 수와 최근 활성 계정을 확인할 수 있으며 약 15초 간격으로 개요 화면에서만 갱신합니다. 점검 모드 ON이 막히던 WebView confirm 문제를 Android 네이티브 확인창 브리지로 수정했고 alert/prompt도 함께 안정화했습니다. 연구자료 열람, 사용자/등급/사용량/운영 설정과 기존 패키지 및 고정 관리자 서명키는 유지합니다."
          fi
