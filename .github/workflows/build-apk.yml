name: Build Android APK 0.2.2

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Restore 0.2.0 base
        shell: bash
        run: |
          cat mobile020tiny.part00.b64 mobile020tiny.part01.b64 mobile020tiny.part02.b64 mobile020tiny.part03a.b64 mobile020tiny.part03b.b64 mobile020tiny.part04.b64 mobile020tiny.part05.b64 mobile020tiny.part06.b64 | base64 --decode > mobile020-build.zip
          echo "8785abec837d646a4c4e069900053ec54cceb9b4260bb42e281269cecb6bf721  mobile020-build.zip" | sha256sum -c -
          unzip -q mobile020-build.zip
          mv mobile020_tiny mobile-app

      - name: Install official brand logo
        shell: bash
        run: |
          mkdir -p mobile-app/app/src/main/assets/mobile
          mkdir -p mobile-app/app/src/main/res/drawable-nodpi
          base64 --decode brandlogo020.b64 > mobile-app/app/src/main/assets/mobile/brand-logo.png
          cp mobile-app/app/src/main/assets/mobile/brand-logo.png mobile-app/app/src/main/res/drawable-nodpi/brand_logo.png
          echo "702d966318e8b9c35bbb130645f2f51b89b39f611fb9a185d391e317f8d46cdd  mobile-app/app/src/main/assets/mobile/brand-logo.png" | sha256sum -c -

      - name: Apply Mobile 0.2.1 overlay
        shell: bash
        run: |
          cat mobile021overlay.groupA.b64 mobile021overlay.groupB.b64 mobile021overlay.groupC.b64 | base64 --decode > mobile021-overlay.zip
          echo "b204e8f825aaa6aa4a7864f62f4ac148ffa4ee7262eb69626160ff2bedf4f347  mobile021-overlay.zip" | sha256sum -c -
          unzip -o -q mobile021-overlay.zip -d mobile-app

      - name: Apply Mobile 0.2.2 overlay
        shell: bash
        run: |
          cat mobile022overlay.part00.b64 mobile022overlay.part01.b64 mobile022overlay.part02.b64 mobile022overlay.part03.b64 | base64 --decode > mobile022-overlay.zip
          echo "16388b596ee5ecbca8f8b465a6571b4c78e8d103d5178f5dd3a1612c622d0007  mobile022-overlay.zip" | sha256sum -c -
          unzip -o -q mobile022-overlay.zip -d mobile-app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate mobile JavaScript
        run: node --check mobile-app/app/src/main/assets/mobile/app.js

      - name: Verify version
        shell: bash
        run: |
          grep -q "versionName '0.2.2'" mobile-app/app/build.gradle
          grep -q "NovelCheckMobile/0.2.2" mobile-app/app/src/main/java/kr/novelcheck/mobile/MainActivity.java

      - name: Build debug APK
        working-directory: mobile-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp mobile-app/app/build/outputs/apk/debug/app-debug.apk AI-Manuscript-Director-Mobile-v0.2.2.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Manuscript-Director-Mobile-v0.2.2-APK
          path: AI-Manuscript-Director-Mobile-v0.2.2.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish persistent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v0.2.2" >/dev/null 2>&1; then
            gh release upload "v0.2.2" AI-Manuscript-Director-Mobile-v0.2.2.apk --clobber
          else
            gh release create "v0.2.2" AI-Manuscript-Director-Mobile-v0.2.2.apk --title "AI 원고 디렉터 Mobile 0.2.2" --notes "Web 8.7.9 기반. 분석 대기열 진행률 정합성, 탭 위치/스크롤 보존, 리포트 렌더링 최적화, 수정메모·보조편집 모바일 UX 개선."
          fi
