name: Build Android APK 0.5.0

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ mobile-app-v0.5.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Restore 0.2.0 base
        shell: bash
        run: |
          cat mobile020tiny.part00.b64 mobile020tiny.part01.b64 mobile020tiny.part02.b64 mobile020tiny.part03a.b64 mobile020tiny.part03b.b64 mobile020tiny.part04.b64 mobile020tiny.part05.b64 mobile020tiny.part06.b64 | base64 --decode > mobile020-build.zip
          echo "8785abec837d646a4c4e069900053ec54cceb9b4260bb42e281269cecb6bf721  mobile020-build.zip" | sha256sum -c -
          unzip -q mobile020-build.zip
          mv mobile020_tiny mobile-app

      - name: Install official brand logo
        shell: bash
        run: |
          mkdir -p mobile-app/app/src/main/assets/mobile
          mkdir -p mobile-app/app/src/main/res/drawable-nodpi
          base64 --decode brandlogo020.b64 > mobile-app/app/src/main/assets/mobile/brand-logo.png
          cp mobile-app/app/src/main/assets/mobile/brand-logo.png mobile-app/app/src/main/res/drawable-nodpi/brand_logo.png
          echo "702d966318e8b9c35bbb130645f2f51b89b39f611fb9a185d391e317f8d46cdd  mobile-app/app/src/main/assets/mobile/brand-logo.png" | sha256sum -c -

      - name: Apply Mobile 0.2.1 overlay
        shell: bash
        run: |
          cat mobile021overlay.groupA.b64 mobile021overlay.groupB.b64 mobile021overlay.groupC.b64 | base64 --decode > mobile021-overlay.zip
          echo "b204e8f825aaa6aa4a7864f62f4ac148ffa4ee7262eb69626160ff2bedf4f347  mobile021-overlay.zip" | sha256sum -c -
          unzip -o -q mobile021-overlay.zip -d mobile-app

      - name: Apply Mobile 0.2.2 overlay
        shell: bash
        run: |
          cat mobile022overlay.part00.b64 mobile022overlay.part01.b64 mobile022overlay.part02.b64 mobile022overlay.part03.b64 | base64 --decode > mobile022-overlay.zip
          echo "16388b596ee5ecbca8f8b465a6571b4c78e8d103d5178f5dd3a1612c622d0007  mobile022-overlay.zip" | sha256sum -c -
          unzip -o -q mobile022-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.0 overlay
        shell: bash
        run: |
          cat mobile030overlay.part00.b64 mobile030overlay.part01.b64 mobile030overlay.part02.b64 mobile030overlay.part03.b64 | base64 --decode > mobile030-overlay.zip
          echo "1342b7bab7804cc511fc08d39381eb7b2375bc454d25d2111b4b6bc2a8df9231  mobile030-overlay.zip" | sha256sum -c -
          unzip -o -q mobile030-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.1 hotfix
        shell: bash
        run: |
          cat mobile031overlay.part00.b64 mobile031overlay.part01.b64 mobile031overlay.part02.b64 mobile031overlay.part03.b64 mobile031overlay.part04.b64 | base64 --decode > mobile031-overlay.zip
          echo "e90d8b1971b76e74a5d0a8468755559040460f70a9978edbccc061212512e041  mobile031-overlay.zip" | sha256sum -c -
          unzip -o -q mobile031-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.2 UX overlay
        shell: bash
        run: |
          cat mobile032overlay.part00.b64 mobile032overlay.part01.b64 mobile032overlay.part02.b64 mobile032overlay.part03.b64 mobile032overlay.part04.b64 | base64 --decode > mobile032-overlay.zip
          echo "66e55a342341c75ad927f96fee3078b76e93ccceaf5b92b7f8cf539498ac3adb  mobile032-overlay.zip" | sha256sum -c -
          unzip -o -q mobile032-overlay.zip -d mobile-app

      - name: Apply Mobile 0.3.3 UX overlay
        shell: bash
        run: |
          cat mobile033overlay.part00.b64 mobile033overlay.part01.b64 mobile033overlay.part02.b64 mobile033overlay.part03.b64 mobile033overlay.part04.b64 | base64 --decode > mobile033-overlay.zip
          echo "265b6fcb2e5087b1327d677f93095ca4883d1720de1d5d4baaa8c65e70c72560  mobile033-overlay.zip" | sha256sum -c -
          unzip -o -q mobile033-overlay.zip -d mobile-app

      - name: Apply Mobile 0.4.0 Web 8.10.6 overlay
        shell: bash
        run: |
          cat mobile040overlay.part00.b64 mobile040overlay.part01.b64 mobile040overlay.part02.b64 mobile040overlay.part03.b64 mobile040overlay.part04.b64 | base64 --decode > mobile040-overlay.zip
          echo "c98c14db4a08a80e5ff43bcfac5af4f23f3668b170e99347834945f2c4fb4056  mobile040-overlay.zip" | sha256sum -c -
          unzip -o -q mobile040-overlay.zip -d mobile-app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: novelcheck-mobile-debug-signing-v1

      - name: Ensure stable Android signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256|Valid from"

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate 0.4.0 / Web 8.10.6 sync
        shell: bash
        run: |
          node --check mobile-app/app/src/main/assets/mobile/app.js
          grep -q "versionName '0.4.0'" mobile-app/app/build.gradle
          grep -q "versionCode 8" mobile-app/app/build.gradle
          grep -q "NovelCheckMobile/0.4.0" mobile-app/app/src/main/java/kr/novelcheck/mobile/MainActivity.java
          grep -q "latestAnalysis?.score" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "공백 포함" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "공백 제외" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "블랙 + 옐로우" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "퍼플" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "나이트" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "updateQueueDom" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "LOAD_NO_CACHE" mobile-app/app/src/main/java/kr/novelcheck/mobile/MainActivity.java

      - name: Apply Mobile 0.5.0 / Web 9.1.0 patch
        shell: bash
        run: |
          base64 --decode patch_mobile050.py.gz.b64 | gzip -dc > patch_mobile050.py
          echo "6c8e80d7ec873df4bac87d5f0bb61d87e51376be1db2a3d9f3e42daac6364797  patch_mobile050.py" | sha256sum -c -
          sed -i "s#root=Path('/mnt/data/app_update_20260929/mobile050')#root=Path('mobile-app')#" patch_mobile050.py
          python patch_mobile050.py

      - name: Validate Mobile 0.5.0 / Web 9.1.0 sync
        shell: bash
        run: |
          node --check mobile-app/app/src/main/assets/mobile/app.js
          python -c "import xml.etree.ElementTree as ET; ET.parse('mobile-app/app/src/main/AndroidManifest.xml')"
          grep -q "applicationId 'kr.novelcheck.mobile'" mobile-app/app/build.gradle
          grep -q "versionName '0.5.0'" mobile-app/app/build.gradle
          grep -q "versionCode 9" mobile-app/app/build.gradle
          grep -q "NovelCheckMobile/0.5.0" mobile-app/app/src/main/java/kr/novelcheck/mobile/MainActivity.java
          grep -q "/api/assistant/chat" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "director-proposal" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "directorMode" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "allowEngineChange" mobile-app/app/src/main/assets/mobile/app.js
          grep -q "onJsConfirm" mobile-app/app/src/main/java/kr/novelcheck/mobile/MainActivity.java
          grep -q "grid-template-columns:repeat(5" mobile-app/app/src/main/assets/mobile/app.css

      - name: Build debug APK
        working-directory: mobile-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs mobile-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp mobile-app/app/build/outputs/apk/debug/app-debug.apk AI-Manuscript-Director-Mobile-v0.5.0.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Manuscript-Director-Mobile-v0.5.0-APK
          path: AI-Manuscript-Director-Mobile-v0.4.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish persistent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v0.5.0" >/dev/null 2>&1; then
            gh release upload "v0.5.0" AI-Manuscript-Director-Mobile-v0.4.0.apk --clobber
          else
            gh release create "v0.5.0" AI-Manuscript-Director-Mobile-v0.4.0.apk               --title "AI 원고 디렉터 Mobile 0.5.0"               --notes "Web 9.1.0 동기화. 모바일 전용 디렉터 채팅을 추가하고 자동/빠른 대화/깊게 분석 모드, 작품·회차·리포트 문맥, 대화 기록, 분석 제안 카드와 실제 분석/재분석 실행 확인, 점수 엔진 변경 확인을 지원합니다. 기존 작품·리포트·대기열·알림·3개 테마와 최적화 구조를 유지하며, 고정 Android 서명키를 계속 사용합니다."
          fi
