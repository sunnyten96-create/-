name: Build Android APK 0.2.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Restore 0.2.0 source
        shell: bash
        run: |
          cat mobile020tiny.part00.b64 mobile020tiny.part01.b64 mobile020tiny.part02.b64 mobile020tiny.part03a.b64 mobile020tiny.part03b.b64 mobile020tiny.part04.b64 mobile020tiny.part05.b64 mobile020tiny.part06.b64 | base64 --decode > mobile020-build.zip
          echo "8785abec837d646a4c4e069900053ec54cceb9b4260bb42e281269cecb6bf721  mobile020-build.zip" | sha256sum -c -
          unzip -q mobile020-build.zip
          mv mobile020_tiny mobile-app

      - name: Install official 8.7.5 brand logo
        shell: bash
        run: |
          LOGO_URL="https://novelcheck-a1.duckdns.org/brand-logo-8.0.5.png"
          mkdir -p mobile-app/app/src/main/assets/mobile
          mkdir -p mobile-app/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --retry-delay 2 "$LOGO_URL" -o mobile-app/app/src/main/assets/mobile/brand-logo.png
          cp mobile-app/app/src/main/assets/mobile/brand-logo.png mobile-app/app/src/main/res/drawable-nodpi/brand_logo.png
          test -s mobile-app/app/src/main/assets/mobile/brand-logo.png

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate mobile JavaScript
        run: node --check mobile-app/app/src/main/assets/mobile/app.js

      - name: Build debug APK
        working-directory: mobile-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp mobile-app/app/build/outputs/apk/debug/app-debug.apk AI-Manuscript-Director-Mobile-v0.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Manuscript-Director-Mobile-v0.2.0-APK
          path: AI-Manuscript-Director-Mobile-v0.2.0.apk
          if-no-files-found: error
          retention-days: 90
